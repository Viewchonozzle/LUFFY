name: sync-readme-todos
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch whose Python files and README should be updated
        required: true
        default: dev
        type: string
      push:
        description: Commit and push the README change
        required: false
        default: "false"
        type: string
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
      - name: Transform README TODO section
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          python3 - <<'PY'
          import io, os, re, subprocess, tokenize, pathlib
          from difflib import SequenceMatcher

          def run(args, check=True):
              return subprocess.run(args, text=True, capture_output=True, check=check)

          run(["git", "fetch", "--no-tags", "origin", "main:refs/remotes/origin/main"], check=False)
          main_ref = "origin/main"
          if run(["git", "rev-parse", "--verify", "--quiet", main_ref], check=False).returncode != 0:
              run(["git", "fetch", "--no-tags", "origin", "main"], check=False)
              if run(["git", "rev-parse", "--verify", "--quiet", main_ref], check=False).returncode != 0:
                  main_ref = "main"

          diff = run(["git", "diff", "--name-only", f"{main_ref}...HEAD"], check=False)
          if diff.returncode != 0 or not diff.stdout.strip():
              diff = run(["git", "diff", "--name-only", main_ref, "HEAD"], check=False)
          changed_paths = [p.strip().replace("\\", "/") for p in diff.stdout.splitlines() if p.strip().endswith(".py")]
          print("CHANGED_PY_FILES=" + repr(changed_paths))

          readme = pathlib.Path("README.md")
          for p in pathlib.Path(".").iterdir():
              if p.is_file() and p.name.lower() == "readme.md":
                  readme = p
                  break

          old_text = readme.read_text(encoding="utf-8", newline="")
          lines = old_text.splitlines(keepends=True)
          title_i = None
          for i, line in enumerate(lines):
              if line.lstrip().startswith("#") and "Complete TODO List" in line:
                  title_i = i
                  break
          if title_i is None:
              raise SystemExit("Complete TODO List title was not found")

          entry_re = re.compile(r'^(?P<lead>\s*)- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<desc>.*)$')
          entries = []
          first_i = None
          last_i = None
          for i in range(title_i + 1, len(lines)):
              raw = lines[i]
              content = raw.rstrip("\r\n")
              m = entry_re.match(content)
              if not m:
                  continue
              first_i = i if first_i is None else first_i
              last_i = i
              entries.append({
                  "idx": i,
                  "lead": m.group("lead"),
                  "path": m.group("path").replace("\\", "/").lstrip("./"),
                  "line": int(m.group("line")),
                  "desc": m.group("desc"),
                  "raw": raw,
                  "eol": raw[len(content):],
                  "norm": re.sub(r"[^a-z0-9]+", "", m.group("desc").lower()),
              })
          if first_i is None:
              raise SystemExit("No README TODO entries found")

          by_path = {}
          for e in entries:
              by_path.setdefault(e["path"], []).append(e)
          final_by_path = {}
          for path, es in by_path.items():
              final_by_path[path] = [{"line": e["line"], "output": e["raw"]} for e in es]

          def normalize(s):
              s = re.sub(r"^\s*todo\b\s*:?\s*", "", s, flags=re.I)
              return re.sub(r"[^a-z0-9]+", "", s.lower())

          def markers_for(path):
              p = pathlib.Path(path)
              if not p.exists() or not p.is_file():
                  return []
              data = p.read_bytes()
              found = []
              try:
                  tokens = tokenize.tokenize(io.BytesIO(data).readline)
                  for tok in tokens:
                      if tok.type != tokenize.COMMENT:
                          continue
                      comment = tok.string[1:].strip()
                      if not re.match(r"^todo\b", comment, flags=re.I):
                          continue
                      desc = re.sub(r"^todo\b\s*:?\s*", "", comment, flags=re.I).strip()
                      found.append({"line": tok.start[0], "desc": desc, "norm": normalize(desc)})
              except Exception:
                  text = data.decode("utf-8", errors="replace")
                  for lineno, src in enumerate(text.splitlines(), 1):
                      mm = re.search(r"#\s*TODO\b\s*:?\s*(.*)$", src, flags=re.I)
                      if mm:
                          desc = mm.group(1).strip()
                          found.append({"line": lineno, "desc": desc, "norm": normalize(desc)})
              return found

          for path in changed_paths:
              old_list = by_path.get(path, [])
              markers = markers_for(path)
              print(f"FILE {path}: old={len(old_list)} current={len(markers)}")
              used = set()
              pairs = {}

              for e in old_list:
                  for n in markers:
                      if id(n) in used or not e["norm"] or e["norm"] != n["norm"]:
                          continue
                      pairs[e["idx"]] = n
                      used.add(id(n))
                      print(f"UPDATE {path}:{e['line']} -> {n['line']} :: {e['desc'][:100]}")
                      break

              for e in old_list:
                  if e["idx"] in pairs:
                      continue
                  best = None
                  best_score = 0.0
                  for n in markers:
                      if id(n) in used or not e["norm"]:
                          continue
                      score = SequenceMatcher(None, e["norm"], n["norm"]).ratio()
                      if score > best_score:
                          best_score, best = score, n
                  if best is not None and best_score >= 0.78:
                      pairs[e["idx"]] = best
                      used.add(id(best))
                      print(f"FUZZY_UPDATE score={best_score:.3f} {path}:{e['line']} -> {best['line']}")

              items = []
              for e in old_list:
                  if e["idx"] not in pairs:
                      print(f"REMOVE {path}:{e['line']} :: {e['desc'][:120]}")
                      continue
                  n = pairs[e["idx"]]
                  updated = f'{e["lead"]}- [ ] **{path}:{n["line"]}** - {e["desc"]}'
                  items.append({"line": n["line"], "output": updated + e["eol"]})

              for n in markers:
                  if id(n) in used:
                      continue
                  print(f"ADD {path}:{n['line']} :: {n['desc'][:120]}")
                  items.append({"line": n["line"], "output": f'- [ ] **{path}:{n["line"]}** - {n["desc"]}\n'})

              final_by_path[path] = sorted(items, key=lambda x: x["line"])

          output_entries = []
          for path in sorted(final_by_path):
              for item in sorted(final_by_path[path], key=lambda x: x["line"]):
                  output_entries.append(item["output"])

          new_lines = lines[:first_i] + output_entries + lines[last_i + 1:]
          new_text = "".join(new_lines)
          if new_text != old_text:
              readme.write_text(new_text, encoding="utf-8", newline="")
              print("README_CHANGED=yes")
          else:
              print("README_CHANGED=no")

          show = run(["git", "--no-pager", "diff", "--", str(readme)], check=False)
          print(show.stdout)
          if show.stderr:
              print(show.stderr)
          PY
      - name: Commit and push README
        if: ${{ inputs.push == 'true' }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README change to commit"
          else
            git commit -m "docs: update complete TODO list"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
